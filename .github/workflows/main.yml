name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 讓底下所有的 run 指令預設都在 26060000 資料夾內執行
    defaults:
      run:
        working-directory: 26060000

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        # 這裡改用相對路徑，指向目前的 working-directory 底下
        cache-dependency-path: '26060000/package-lock.json' 

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build
