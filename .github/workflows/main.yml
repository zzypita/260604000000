name: Node.js CI

on:
  push:
    branches: [ "main" ] # 當推送到 main 分支時觸發（請根據你的預設分支修改，例如 master）
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: '26060000/package-lock.json' # 修正後的子目錄路徑

    - name: Install dependencies
      run: |
        cd 26060000
        npm ci

    - name: Build project
      run: |
        cd 26060000
        npm run build # 如果你有打包指令的話
